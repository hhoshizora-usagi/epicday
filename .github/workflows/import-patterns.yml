name: import-patterns-03-06

# One-time import of design patterns 03-06 (built by Migoo) into main and gh-pages.
on:
  push:
    branches: [main]
    paths: [".github/workflows/import-patterns.yml"]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download pages
        run: |
          set -e
          get() { mkdir -p "$1"; curl -fsSL -o "$1/index.html" "$2"; s=$(wc -c < "$1/index.html"); echo "$1 $s bytes"; test "$s" -gt 100000; grep -Eq 'id="?root' "$1/index.html"; }
          get editorial "https://sg.migoo.ai/beeai/api/v1/media/signed/budee/2026/11/09/bfce3979.html?expires=1794212005&sig=88dbfe0b958cb5e5fb4372a398e627a69b9cb83da4a4ff74d8b6c69c2ae6ed96"
          get luxury "https://sg.migoo.ai/beeai/api/v1/media/signed/budee/2026/11/09/57fc0a2b.html?expires=1794212006&sig=881ee0ac6304716afadda044ddf99d81feaae527f455f26272b36adfd0c9f323"
          get kinetic "https://sg.migoo.ai/beeai/api/v1/media/signed/budee/2026/11/09/6435fd30.html?expires=1794212006&sig=bbc4b374720c0932889f83175e88251584002d5dcea3e674af88c01dbb5fa5b5"
          get bento "https://sg.migoo.ai/beeai/api/v1/media/signed/budee/2026/11/09/7dc9cc88.html?expires=1794212006&sig=32ad8c85a8c60cdf4b314c4ec349cde6bee19cc5759b402fbdc3c0c641162fb7"
      - name: Commit to main and gh-pages
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          git add editorial luxury kinetic bento
          git commit -m "Add EPIC DAY patterns 03-06: editorial / luxury / kinetic / bento"
          git push origin HEAD:main
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          git checkout main -- index.html editorial luxury kinetic bento
          git commit -m "Publish EPIC DAY patterns 03-06 and 6-pattern index"
          git push origin gh-pages
