name: import-site
on:
  push:
    paths: ['.github/workflows/import-site.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pages
        run: |
          mkdir -p simple plus
          curl -fsSL -o simple/index.html 'https://sg.migoo.ai/beeai/api/v1/media/signed/budee/2026/11/09/d63b5064.html?expires=1794210273&sig=3316e11c1086de791582c02002d09648196d0b76038817788342accc17d9048d'
          curl -fsSL -o plus/index.html 'https://sg.migoo.ai/beeai/api/v1/media/signed/budee/2026/11/09/433b0d53.html?expires=1794210273&sig=5210efd8a4964a1f14c3f5c37f531dd4edbdcea2f542b59c7d067c88c24b4898'
          for f in simple/index.html plus/index.html; do
            sed -i 's#<title>EPICDAY 2027 — ONE DAY. EVERY COLOR.</title>#<title>EPIC DAY — 音楽フェス公式サイト</title>#' "$f"
            sed -i 's#content="EPICDAY 2027 — 音楽・アート・フードがぜんぶ混ざった、年に一度のワンデイ・フェス。2027.05.01 SAT"#content="EPIC DAY 音楽フェス公式サイト。ライブステージ「EPIC DAY」と、モデル×アーティストのステージ「REBORN」。"#' "$f"
          done
          ls -la simple plus
          grep -o '<title>[^<]*</title>' simple/index.html plus/index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simple/index.html plus/index.html
          git commit -m "Add EPIC DAY pages: simple / plus"
          git push
