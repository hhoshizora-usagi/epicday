name: Publish site (download built HTML)

# Downloads the finished single-file site (built by Migoo) and commits it as index.html.
# Run from the Actions tab, or via API, with the download URL of the new build.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Download URL of the built HTML file"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download built site
        env:
          SITE_URL: ${{ inputs.url }}
        run: |
          curl -fsSL -o index.html "$SITE_URL"
          SIZE=$(wc -c < index.html)
          echo "Downloaded $SIZE bytes"
          test "$SIZE" -gt 100000
          grep -q 'id="root"' index.html
          touch .nojekyll

      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Publish EPIC DAY site"
          git push
